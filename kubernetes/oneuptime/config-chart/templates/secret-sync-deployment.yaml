apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-openbao-secret-sync
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oneuptime-openbao-secret-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oneuptime-openbao-secret-sync
    spec:
      enableServiceLinks: false
      serviceAccountName: oneuptime-csi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              while true; do
                for path in /mnt/secrets-store/*; do
                  test -s "$path"
                done
                sleep 3600
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oneuptime-openbao
