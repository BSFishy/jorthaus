walG:
  version: 3.0.9
  releaseBaseUrl: https://github.com/wal-g/wal-g/releases/download/v3.0.9
  releaseTarball: wal-g-pg-22.04-amd64.tar.gz
  releaseTarballSha256: wal-g-pg-22.04-amd64.tar.gz.sha256
  initImage: postgres:18.6-bookworm
  runtimeImage: postgres:18.6-bookworm

backup:
  schedule: "15 03 * * *"
  activeDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

retention:
  fullBackups: 14

prune:
  schedule: "15 05 * * *"
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
