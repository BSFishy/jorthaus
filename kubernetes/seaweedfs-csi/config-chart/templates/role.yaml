apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-csi-config-sync
  namespace: kube-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - seaweedfs-csi-config
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - delete
