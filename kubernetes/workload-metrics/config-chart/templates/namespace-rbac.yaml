{{- $namespaces := list "authentik" "cert-manager" "kube-system" "thanos" "traefik" -}}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-app-metrics-discovery
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-app-metrics-discovery
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: prometheus-app-metrics
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-app-metrics-discovery
{{- end }}
