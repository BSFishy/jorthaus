repositories:
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.21.1
    values:
      - crds:
          enabled: true
        serviceLabels:
          prometheus.jort.haus/scrape: "true"
        resources:
          requests:
            cpu: 10m
            memory: 160Mi
          limits:
            memory: 256Mi
        cainjector:
          serviceLabels:
            prometheus.jort.haus/scrape: "true"
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 192Mi
        webhook:
          serviceLabels:
            prometheus.jort.haus/scrape: "true"
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi

  - name: cert-manager-config
    namespace: cert-manager
    createNamespace: true
    chart: ./config-chart
    needs:
      - cert-manager/cert-manager
