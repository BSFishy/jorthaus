apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
      annotations:
        k8s.v1.cni.cncf.io/networks: homelab-lan
    spec:
      initContainers:
        - name: configure-reverse-proxy
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              mkdir -p /config/.storage
              if [ ! -f /config/.storage/http ]; then
                cat > /config/.storage/http <<'EOF'
              {
                "version": 2,
                "minor_version": 2,
                "key": "http",
                "data": {
                  "stable": {
                    "server_port": 8123,
                    "ssl_profile": "modern",
                    "cors_allowed_origins": ["https://cast.home-assistant.io"],
                    "use_x_forwarded_for": true,
                    "trusted_proxies": ["10.42.0.0/16"],
                    "use_x_frame_options": true,
                    "ip_ban_enabled": true,
                    "login_attempts_threshold": -1,
                    "created_at": null,
                    "error": null,
                    "error_message": null
                  },
                  "pending": null,
                  "yaml_migration_done": true
                }
              }
              EOF
              elif ! grep -q '"use_x_forwarded_for"' /config/.storage/http; then
                sed -i '/"ssl_profile"/a\      "use_x_forwarded_for": true,\n      "trusted_proxies": ["10.42.0.0/16"],' /config/.storage/http
              fi
          volumeMounts:
            - name: config
              mountPath: /config
        - name: configure-lan-routes
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              ip route replace 10.0.2.0/24 via 10.1.0.1 dev net1
              ip route replace 10.0.4.0/24 via 10.1.0.1 dev net1
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.9.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Atlantic/Reykjavik
          ports:
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home.jort.haus`)
      kind: Rule
      services:
        - name: home-assistant
          port: 8123
  tls: {}
