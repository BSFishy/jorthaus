repositories:
  - name: cilium
    url: https://helm.cilium.io/

releases:
  - name: cilium
    namespace: kube-system
    createNamespace: true
    chart: cilium/cilium
    version: 1.20.1
    values:
      - values/cilium.yaml

  - name: cilium-config
    namespace: kube-system
    chart: ./config-chart
