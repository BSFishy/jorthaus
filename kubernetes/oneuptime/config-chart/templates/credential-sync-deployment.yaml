apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-credential-sync
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oneuptime-credential-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oneuptime-credential-sync
    spec:
      enableServiceLinks: false
      serviceAccountName: oneuptime-credential-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: python:3.13.7-slim-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/credential-sync.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAULT_ADDR
              value: https://openbao.service.jort.haus:8200
            - name: VAULT_ROLE
              value: oneuptime-credential-sync
            - name: POSTGRES_CREDS_PATH
              value: postgres/creds/oneuptime
            - name: ROTATION_SECONDS
              value: "604800"
            - name: POLL_SECONDS
              value: "300"
            - name: RETRY_SECONDS
              value: "300"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /app/credential-sync.py
              subPath: credential-sync.py
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: oneuptime-credential-sync
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 3600
