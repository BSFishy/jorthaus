apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: oneuptime-postgres
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: https://openbao.service.jort.haus:8200
      path: postgres
      version: v1
      auth:
        kubernetes:
          mountPath: kubernetes
          role: oneuptime-credential-sync
          serviceAccountRef:
            name: oneuptime-credential-sync
            namespace: {{ .Release.Namespace }}
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: oneuptime-valkey
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: https://openbao.service.jort.haus:8200
      path: valkey
      version: v1
      auth:
        kubernetes:
          mountPath: kubernetes
          role: oneuptime-credential-sync
          serviceAccountRef:
            name: oneuptime-credential-sync
            namespace: {{ .Release.Namespace }}
            audiences:
              - vault
