groups:
  - name: node-health
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node exporter on {{ $labels.host }} is unreachable"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than 10 minutes."
      - record: node_cpu_utilization:ratio
        expr: |
          1 - avg by (host, instance) (
            rate(node_cpu_seconds_total{job="node", mode="idle"}[5m])
          )
      - alert: NodeCpuUsageWarning
        expr: node_cpu_utilization:ratio > 0.8 and node_cpu_utilization:ratio <= 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is high on {{ $labels.host }}"
          description: "Host CPU usage has remained above 80% for 15 minutes ({{ $value | humanizePercentage }})."
      - alert: NodeCpuUsageCritical
        expr: node_cpu_utilization:ratio > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CPU usage is critically high on {{ $labels.host }}"
          description: "Host CPU usage has remained above 95% for 5 minutes ({{ $value | humanizePercentage }})."
      - alert: NodeFilesystemSpaceLow
        expr: |
          100 * node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"}
          / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 10
          and
          100 * node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"}
          / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem space is low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 10% available space."
      - alert: NodeFilesystemSpaceCritical
        expr: 100 * node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem space is critically low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 5% available space."
      - alert: NodeFilesystemInodesLow
        expr: |
          100 * node_filesystem_files_free{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"}
          / node_filesystem_files{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 20
          and
          100 * node_filesystem_files_free{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"}
          / node_filesystem_files{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem inodes are low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 20% of inodes available."
      - alert: NodeFilesystemInodesCritical
        expr: 100 * node_filesystem_files_free{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} / node_filesystem_files{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem inodes are critically low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 10% of inodes available."
      - alert: NodeMemoryAvailableLow
        expr: |
          100 * node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 10
          and
          100 * node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Available memory is low on {{ $labels.host }}"
          description: "Less than 10% of memory is available on {{ $labels.instance }}."
      - alert: NodeMemoryAvailableCritical
        expr: 100 * node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Available memory is critically low on {{ $labels.host }}"
          description: "Less than 5% of memory is available on {{ $labels.instance }}."
  - name: monitoring-health
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager|victorialogs|thanos-sidecar|thanos-query|thanos-storegateway|thanos-compactor|kube-state-metrics|kubelet|kubelet-cadvisor|kubernetes-control-plane|coredns|kured|secrets-store-csi|traefik|cert-manager|authentik-server|authentik-worker|seaweedfs-csi|cilium-agent|cilium-operator|cilium-envoy|postgres"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is unreachable"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than 10 minutes."
  - name: postgres-capacity
    rules:
      - alert: PostgresExporterDatabaseDown
        expr: pg_up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable from the exporter on {{ $labels.host }}"
          description: "The PostgreSQL exporter cannot connect to {{ $labels.instance }}."
      - alert: PostgresExporterScrapeErrors
        expr: pg_exporter_last_scrape_error{job="postgres"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter cannot collect all metrics from {{ $labels.host }}"
          description: "At least one PostgreSQL exporter collector is failing on {{ $labels.instance }}."
      - record: postgres_connection_slot_utilization:ratio
        expr: |
          (
            # The exporter excludes its single pooled backend from this metric.
            sum by (host, instance) (
              pg_stat_activity_count{job="postgres", backend_type="client backend"}
            )
            + 1
          )
          /
          (
            max by (host, instance) (pg_settings_max_connections{job="postgres"})
            - max by (host, instance) (pg_settings_superuser_reserved_connections{job="postgres"})
            - max by (host, instance) (pg_settings_reserved_connections{job="postgres"})
          )
      - alert: PostgresConnectionSlotsWarning
        expr: postgres_connection_slot_utilization:ratio >= 0.7 and postgres_connection_slot_utilization:ratio < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL client slots are above 70% on {{ $labels.host }}"
          description: "Client backends are using {{ $value | humanizePercentage }} of slots available to non-reserved roles."
      - alert: PostgresConnectionSlotsCritical
        expr: postgres_connection_slot_utilization:ratio >= 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL client slots are above 90% on {{ $labels.host }}"
          description: "Client backends are using {{ $value | humanizePercentage }} of slots available to non-reserved roles."
  - name: kubernetes-object-health
    rules:
      - alert: KubernetesDeploymentReplicasUnavailable
        expr: |
          (
            kube_deployment_status_replicas_unavailable > 0
            and on (namespace, deployment) kube_deployment_spec_replicas > 0
          )
          unless on (namespace, deployment)
          (
            kube_deployment_status_replicas_available{namespace=~"kube-system|monitoring|thanos|authentik|postgres-backup"} == 0
            and on (namespace, deployment) kube_deployment_spec_replicas > 0
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
          description: "The deployment has had unavailable replicas for more than 10 minutes."
      - alert: KubernetesDeploymentUnavailableCritical
        expr: |
          kube_deployment_status_replicas_available{namespace=~"kube-system|monitoring|thanos|authentik|postgres-backup"} == 0
          and on (namespace, deployment) kube_deployment_spec_replicas > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has no available replicas"
          description: "The core deployment has had zero available replicas for more than 5 minutes."
      - alert: KubernetesStatefulSetReplicasUnavailable
        expr: |
          (
            kube_statefulset_status_replicas_ready
            < on (namespace, statefulset) kube_statefulset_replicas
          )
          unless on (namespace, statefulset)
          (
            kube_statefulset_status_replicas_ready{namespace=~"kube-system|monitoring|thanos|authentik|postgres-backup"} == 0
            and on (namespace, statefulset) kube_statefulset_replicas > 0
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has unavailable replicas"
          description: "The StatefulSet has had fewer ready replicas than desired for more than 10 minutes."
      - alert: KubernetesStatefulSetUnavailableCritical
        expr: |
          kube_statefulset_status_replicas_ready{namespace=~"kube-system|monitoring|thanos|authentik|postgres-backup"} == 0
          and on (namespace, statefulset) kube_statefulset_replicas > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has no ready replicas"
          description: "The core StatefulSet has had zero ready replicas for more than 5 minutes."
      - alert: KubernetesDaemonSetUnavailable
        expr: |
          kube_daemonset_status_number_unavailable > 0
          unless on (namespace, daemonset)
          (
            kube_daemonset_status_number_unavailable{namespace="kube-system"}
            >= on (namespace, daemonset) kube_daemonset_status_desired_number_scheduled{namespace="kube-system"}
            and on (namespace, daemonset) kube_daemonset_status_desired_number_scheduled{namespace="kube-system"} > 0
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has unavailable Pods"
          description: "The DaemonSet has had unavailable Pods for more than 10 minutes."
      - alert: KubernetesDaemonSetUnavailableCritical
        expr: |
          kube_daemonset_status_number_unavailable{namespace="kube-system"}
          >= on (namespace, daemonset) kube_daemonset_status_desired_number_scheduled{namespace="kube-system"}
          and on (namespace, daemonset) kube_daemonset_status_desired_number_scheduled{namespace="kube-system"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has no available Pods"
          description: "The core DaemonSet has had all desired Pods unavailable for more than 5 minutes."
      - alert: KubernetesPodUnschedulable
        expr: kube_pod_status_scheduled{condition="false"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is unschedulable"
          description: "The Pod has remained unschedulable for more than 10 minutes."
      - alert: KubernetesPodPending
        expr: |
          (kube_pod_status_phase{phase="Pending"} == 1)
          unless on (namespace, pod) (kube_pod_status_scheduled{condition="false"} == 1)
          unless on (namespace, pod) (kube_pod_owner{owner_kind="Job"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} remains pending"
          description: "The scheduled Pod has remained in Pending phase for more than 10 minutes."
      - alert: KubernetesPodFailed
        expr: |
          (kube_pod_status_phase{phase="Failed"} == 1)
          unless on (namespace, pod) (kube_pod_owner{owner_kind="Job"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has failed"
          description: "The non-Job Pod has remained in Failed phase for more than 5 minutes."
      - alert: KubernetesPodUnknown
        expr: |
          (kube_pod_status_phase{phase="Unknown"} == 1)
          unless on (namespace, pod) (kube_pod_owner{owner_kind="Job"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has unknown status"
          description: "The non-Job Pod has remained in Unknown phase for more than 5 minutes."
      - alert: KubernetesContainerWaiting
        expr: |
          (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ErrImagePull|ImagePullBackOff|CreateContainerConfigError|CreateContainerError|RunContainerError|ContainerCannotRun|InvalidImageName"} == 1)
          unless on (namespace, pod) (kube_pod_owner{owner_kind="Job"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is waiting"
          description: "The container has remained in {{ $labels.reason }} for more than 5 minutes."
      - alert: KubernetesContainerRestarting
        expr: |
          (increase(kube_pod_container_status_restarts_total[15m]) >= 3)
          unless on (namespace, pod) (kube_pod_owner{owner_kind="Job"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is restarting repeatedly"
          description: "The container has restarted at least 3 times in 15 minutes."
      - alert: KubernetesJobFailed
        expr: kube_job_failed{condition="true",namespace!="postgres-backup"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
          description: "The Job has remained in the Failed condition for more than 5 minutes."
      - alert: KubernetesPostgresBackupJobFailed
        expr: kube_job_failed{condition="true",namespace="postgres-backup"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL backup Job {{ $labels.job_name }} failed"
          description: "The backup or prune Job has remained in the Failed condition for more than 5 minutes."
      - alert: KubernetesCronJobMissedSchedule
        expr: |
          time() > kube_cronjob_next_schedule_time{namespace!="postgres-backup"} + 1800
          and on (namespace, cronjob) kube_cronjob_status_active{namespace!="postgres-backup"} == 0
          and on (namespace, cronjob) kube_cronjob_spec_suspend{namespace!="postgres-backup"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} missed its schedule"
          description: "No Job became active within 30 minutes after the expected schedule."
      - alert: KubernetesPostgresBackupCronJobMissedSchedule
        expr: |
          time() > kube_cronjob_next_schedule_time{namespace="postgres-backup"} + 1800
          and on (namespace, cronjob) kube_cronjob_status_active{namespace="postgres-backup"} == 0
          and on (namespace, cronjob) kube_cronjob_spec_suspend{namespace="postgres-backup"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL backup CronJob {{ $labels.cronjob }} missed its schedule"
          description: "No Job became active within 30 minutes after the expected schedule."
      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status=~"false|unknown"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node {{ $labels.node }} is not Ready"
          description: "The node has remained NotReady or Unknown for more than 5 minutes."
      - alert: KubernetesNodePressure
        expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kubernetes node {{ $labels.node }} has {{ $labels.condition }}"
          description: "The node condition {{ $labels.condition }} has remained true for more than 10 minutes."
      - alert: KubernetesPersistentVolumeClaimPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending"
          description: "The claim has remained pending for more than 10 minutes."
      - alert: KubernetesPersistentVolumeClaimLost
        expr: kube_persistentvolumeclaim_status_phase{phase="Lost"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is Lost"
          description: "The claim has remained in the Lost phase for more than 5 minutes."
  - name: kubernetes-container-resources
    rules:
      - record: container_cpu_request_utilization:ratio
        expr: |
          sum by (namespace, pod, container, node) (
            label_replace(
              rate(container_cpu_usage_seconds_total{job="kubelet-cadvisor",namespace!="",pod!="",container!="",host!=""}[5m]),
              "node", "$1", "host", "(.+)"
            )
          )
          /
          on (namespace, pod, container, node)
          max by (namespace, pod, container, node) (
            kube_pod_container_resource_requests{job="kube-state-metrics",resource="cpu",unit="core"} > 0
          )
      - record: container_cpu_throttled_periods:rate5m
        expr: |
          sum by (namespace, pod, container, node) (
            label_replace(
              rate(container_cpu_cfs_throttled_periods_total{job="kubelet-cadvisor",namespace!="",pod!="",container!="",host!=""}[5m]),
              "node", "$1", "host", "(.+)"
            )
          )
      - record: container_cpu_periods:rate5m
        expr: |
          sum by (namespace, pod, container, node) (
            label_replace(
              rate(container_cpu_cfs_periods_total{job="kubelet-cadvisor",namespace!="",pod!="",container!="",host!=""}[5m]),
              "node", "$1", "host", "(.+)"
            )
          )
      - record: container_cpu_throttled_periods:ratio5m
        expr: |
          container_cpu_throttled_periods:rate5m
          /
          on (namespace, pod, container, node)
          container_cpu_periods:rate5m
      - record: container_memory_limit_utilization:ratio
        expr: |
          sum by (namespace, pod, container, node) (
            label_replace(
              container_memory_working_set_bytes{job="kubelet-cadvisor",namespace!="",pod!="",container!="",host!=""},
              "node", "$1", "host", "(.+)"
            )
          )
          /
          on (namespace, pod, container, node)
          max by (namespace, pod, container, node) (
            kube_pod_container_resource_limits{job="kube-state-metrics",resource="memory",unit="byte"} > 0
          )
      - record: container_memory_request_utilization:ratio
        expr: |
          (
            sum by (namespace, pod, container, node) (
              label_replace(
                container_memory_working_set_bytes{job="kubelet-cadvisor",namespace!="",pod!="",container!="",host!=""},
                "node", "$1", "host", "(.+)"
              )
            )
            /
            on (namespace, pod, container, node)
            max by (namespace, pod, container, node) (
              kube_pod_container_resource_requests{job="kube-state-metrics",resource="memory",unit="byte"} > 0
            )
          )
          unless on (namespace, pod, container, node)
          max by (namespace, pod, container, node) (
            kube_pod_container_resource_limits{job="kube-state-metrics",resource="memory",unit="byte"} > 0
          )
      - record: container_oom_events:increase5m
        expr: |
          sum by (namespace, pod, container, node) (
            label_replace(
              increase(container_oom_events_total{job="kubelet-cadvisor",namespace!="",pod!="",container!="",host!=""}[5m]),
              "node", "$1", "host", "(.+)"
            )
          )
      - record: kube_pod_container_info_by_node:info
        expr: |
          max by (namespace, pod, container, node) (
            kube_pod_container_info{job="kube-state-metrics",namespace!~"kube-system|monitoring|traefik|postgres-backup"}
            * on (namespace, pod) group_left (node)
            kube_pod_info{job="kube-state-metrics",node!=""}
          )
      - record: kube_pod_container_cpu_budget_missing:info
        expr: |
          (
            kube_pod_container_info_by_node:info
            unless on (namespace, pod, container, node)
            max by (namespace, pod, container, node) (
              kube_pod_container_resource_requests{job="kube-state-metrics",resource="cpu",unit="core"}
              or on (namespace, pod, container, node)
              kube_pod_container_resource_limits{job="kube-state-metrics",resource="cpu",unit="core"}
            )
          )
          unless on (namespace, pod)
          (kube_pod_owner{job="kube-state-metrics",owner_kind="Job"} == 1)
      - record: kube_pod_container_memory_budget_missing:info
        expr: |
          (
            kube_pod_container_info_by_node:info
            unless on (namespace, pod, container, node)
            max by (namespace, pod, container, node) (
              kube_pod_container_resource_requests{job="kube-state-metrics",resource="memory",unit="byte"}
              or on (namespace, pod, container, node)
              kube_pod_container_resource_limits{job="kube-state-metrics",resource="memory",unit="byte"}
            )
          )
          unless on (namespace, pod)
          (kube_pod_owner{job="kube-state-metrics",owner_kind="Job"} == 1)
      - alert: KubernetesContainerCpuAboveRequest
        expr: container_cpu_request_utilization:ratio > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} uses over twice its CPU request"
          description: "CPU use has remained above 2x the request for 15 minutes on node {{ $labels.node }}."
      - alert: KubernetesContainerCpuThrottlingWarning
        expr: |
          container_cpu_throttled_periods:ratio5m >= 0.25
          and container_cpu_throttled_periods:ratio5m < 0.5
          and on (namespace, pod, container, node) container_cpu_periods:rate5m > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is CPU-throttled"
          description: "At least 25% of CPU enforcement periods have been throttled for 15 minutes on node {{ $labels.node }}."
      - alert: KubernetesContainerCpuThrottlingCritical
        expr: |
          container_cpu_throttled_periods:ratio5m >= 0.5
          and on (namespace, pod, container, node) container_cpu_periods:rate5m > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is severely CPU-throttled"
          description: "At least 50% of CPU enforcement periods have been throttled for 5 minutes on node {{ $labels.node }}."
      - alert: KubernetesContainerMemoryNearLimit
        expr: |
          container_memory_limit_utilization:ratio > 0.8
          and container_memory_limit_utilization:ratio < 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is near its memory limit"
          description: "Working set has remained above 80% of its memory limit for 15 minutes on node {{ $labels.node }}."
      - alert: KubernetesContainerMemoryLimitCritical
        expr: container_memory_limit_utilization:ratio >= 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is near its memory limit"
          description: "Working set has remained above 95% of its memory limit for 5 minutes on node {{ $labels.node }}."
      - alert: KubernetesContainerMemoryAboveRequest
        expr: container_memory_request_utilization:ratio > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Unbounded container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} exceeds twice its memory request"
          description: "Working set has remained above 2x its memory request, with no memory limit set, for 15 minutes on node {{ $labels.node }}."
      - alert: KubernetesContainerOomWarning
        expr: container_oom_events:increase5m{namespace!~"kube-system|monitoring|thanos|authentik|postgres-backup"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} had an OOM event"
          description: "An out-of-memory event was recorded in the last 5 minutes on node {{ $labels.node }}."
      - alert: KubernetesContainerOomCritical
        expr: container_oom_events:increase5m{namespace=~"kube-system|monitoring|thanos|authentik|postgres-backup"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Core container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} had an OOM event"
          description: "An out-of-memory event was recorded in the last 5 minutes on node {{ $labels.node }}."
      - alert: KubernetesContainerCpuBudgetMissing
        expr: kube_pod_container_cpu_budget_missing:info
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} has no CPU request or limit"
          description: "CPU usage cannot be compared with a declared request or limit on node {{ $labels.node }}."
      - alert: KubernetesContainerMemoryBudgetMissing
        expr: kube_pod_container_memory_budget_missing:info
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} has no memory request or limit"
          description: "Memory usage cannot be compared with a declared request or limit on node {{ $labels.node }}."
  - name: xfs-project-quota-health
    rules:
      - record: jorthaus_xfs_project_quota_utilization:ratio
        expr: |
          jorthaus_xfs_project_quota_used_bytes{job="node"}
          /
          on (host, filesystem, project)
          (jorthaus_xfs_project_quota_hard_limit_bytes{job="node"} > 0)
      - alert: XfsProjectQuotaUsageWarning
        expr: |
          jorthaus_xfs_project_quota_utilization:ratio > 0.8
          and jorthaus_xfs_project_quota_utilization:ratio < 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "XFS project quota {{ $labels.project }} is above 80% on {{ $labels.host }}"
          description: "{{ $labels.filesystem }} project {{ $labels.project }} has remained above 80% of its hard quota for 15 minutes ({{ $value | humanizePercentage }})."
      - alert: XfsProjectQuotaUsageCritical
        expr: jorthaus_xfs_project_quota_utilization:ratio >= 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "XFS project quota {{ $labels.project }} is above 90% on {{ $labels.host }}"
          description: "{{ $labels.filesystem }} project {{ $labels.project }} has remained above 90% of its hard quota for 5 minutes ({{ $value | humanizePercentage }})."
      - alert: XfsProjectQuotaCollectionFailed
        expr: jorthaus_xfs_project_quota_collector_success{job="node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "XFS project quota collection failed on {{ $labels.host }}"
          description: "The quota report for {{ $labels.filesystem }} could not be read completely; inspect the jorthaus-xfs-quota-metrics service."
      - alert: XfsProjectQuotaMetricsStale
        expr: time() - jorthaus_xfs_project_quota_collection_timestamp_seconds{job="node"} > 180
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "XFS project quota metrics are stale on {{ $labels.host }}"
          description: "The last quota collection attempt for {{ $labels.filesystem }} was more than 3 minutes ago."
  - name: openbao-backup-health
    rules:
      - alert: OpenBaoBackupStale
        expr: |
          time() - max(openbao_raft_backup_last_success_timestamp_seconds{job="node"}) > 36 * 60 * 60
          or absent(openbao_raft_backup_last_success_timestamp_seconds{job="node"})
        for: 15m
        labels:
          severity: critical
          sliver: openbao
        annotations:
          summary: "OpenBao Raft backup is stale"
          description: "No verified OpenBao Raft snapshot has been backed up in the last 36 hours."
