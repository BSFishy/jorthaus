{{- define "postgres-backup.installWalG" -}}
set -euo pipefail
if command -v apk >/dev/null 2>&1; then
  apk add --no-cache ca-certificates wget tar coreutils
elif command -v apt-get >/dev/null 2>&1; then
  export DEBIAN_FRONTEND=noninteractive
  apt-get update
  apt-get install -y --no-install-recommends ca-certificates wget tar coreutils
  rm -rf /var/lib/apt/lists/*
else
  echo "unsupported init image package manager" >&2
  exit 1
fi
cd /tmp
WALG_EXTRACTED_BIN="$(basename {{ .Values.walG.releaseTarball | quote }} .tar.gz)"
wget -O {{ .Values.walG.releaseTarball }} {{ .Values.walG.releaseBaseUrl }}/{{ .Values.walG.releaseTarball }}
wget -O {{ .Values.walG.releaseTarballSha256 }} {{ .Values.walG.releaseBaseUrl }}/{{ .Values.walG.releaseTarballSha256 }}
sha256sum -c {{ .Values.walG.releaseTarballSha256 }}
tar -xzf {{ .Values.walG.releaseTarball }} -C /tools
mv "/tools/${WALG_EXTRACTED_BIN}" /tools/wal-g
chmod 0755 /tools/wal-g
/tools/wal-g --version
{{- end }}

{{- define "postgres-backup.env" -}}
if [ ! -f /etc/ssl/certs/ca-certificates.crt ] && command -v apt-get >/dev/null 2>&1; then
  export DEBIAN_FRONTEND=noninteractive
  apt-get update
  apt-get install -y --no-install-recommends ca-certificates
  rm -rf /var/lib/apt/lists/*
fi
export AWS_ACCESS_KEY_ID="$(cat /mnt/secrets-store/aws_access_key_id)"
export AWS_SECRET_ACCESS_KEY="$(cat /mnt/secrets-store/aws_secret_access_key)"
export AWS_ENDPOINT="$(cat /mnt/secrets-store/aws_endpoint)"
export AWS_REGION="$(cat /mnt/secrets-store/aws_region)"
export WALG_S3_PREFIX="$(cat /mnt/secrets-store/walg_s3_prefix)"
export AWS_S3_FORCE_PATH_STYLE=true
export PGHOST=postgres.service.jort.haus
export PGPORT=5432
export PGDATABASE=postgres
export PGUSER="$(cat /mnt/secrets-store/username)"
export PGPASSWORD="$(cat /mnt/secrets-store/password)"
export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
export PGSSLMODE=verify-full
export PGSSLROOTCERT=/etc/ssl/certs/ca-certificates.crt
export PGAPPNAME=jorthaus-postgres-backup
{{- end }}

apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: Never
          initContainers:
            - name: install-wal-g
              image: {{ .Values.walG.initImage | quote }}
              command:
                - bash
                - -ec
                - |
{{ include "postgres-backup.installWalG" . | indent 18 }}
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: {{ .Values.walG.runtimeImage | quote }}
              command:
                - bash
                - -ec
                - |
{{ include "postgres-backup.env" . | indent 18 }}
                  /tools/wal-g backup-push --verify
                  /tools/wal-g backup-list --detail --json
                  /tools/wal-g wal-verify integrity timeline --json
              resources:
{{ toYaml .Values.backup.resources | indent 16 }}
              volumeMounts:
                - name: tools
                  mountPath: /tools
                - name: secrets-store
                  mountPath: /mnt/secrets-store
                  readOnly: true
          volumes:
            - name: tools
              emptyDir: {}
            - name: secrets-store
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: postgres-backup-openbao
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-prune
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.prune.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.prune.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.prune.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.prune.activeDeadlineSeconds }}
      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: Never
          initContainers:
            - name: install-wal-g
              image: {{ .Values.walG.initImage | quote }}
              command:
                - bash
                - -ec
                - |
{{ include "postgres-backup.installWalG" . | indent 18 }}
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: prune
              image: {{ .Values.walG.runtimeImage | quote }}
              command:
                - bash
                - -ec
                - |
{{ include "postgres-backup.env" . | indent 18 }}
                  /tools/wal-g delete retain FULL {{ .Values.retention.fullBackups }} --use-sentinel-time --confirm
                  /tools/wal-g backup-list --detail --json
                  /tools/wal-g wal-verify integrity timeline --json
              resources:
{{ toYaml .Values.prune.resources | indent 16 }}
              volumeMounts:
                - name: tools
                  mountPath: /tools
                - name: secrets-store
                  mountPath: /mnt/secrets-store
                  readOnly: true
          volumes:
            - name: tools
              emptyDir: {}
            - name: secrets-store
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: postgres-backup-openbao
