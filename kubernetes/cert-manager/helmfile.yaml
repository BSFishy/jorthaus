repositories:
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.21.1
    values:
      - crds:
          enabled: true

  - name: cert-manager-config
    namespace: cert-manager
    createNamespace: true
    chart: ./config-chart
    needs:
      - cert-manager/cert-manager
