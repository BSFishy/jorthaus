apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-csi-config-sync
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-csi-config-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-csi-config-sync
    spec:
      serviceAccountName: seaweedfs-csi-config-sync
      containers:
        - name: sync
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              while true; do
                ls -l /mnt/secrets-store
                sleep 3600
              done
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
        - name: reloader
          image: bitnami/kubectl@sha256:65447dcbb2813878e22265949a4ba4cca02f8d008ff3fe66a25354b511f28015
          command:
            - sh
            - -ec
            - |
              last_rv=""
              while true; do
                rv="$(kubectl -n kube-system get secret seaweedfs-csi-config -o jsonpath='{.metadata.resourceVersion}')"
                if [ -n "$last_rv" ] && [ "$rv" != "$last_rv" ]; then
                  kubectl -n kube-system delete pod -l app=seaweedfs-csi-driver-mount --ignore-not-found --wait=false
                  kubectl -n kube-system delete pod -l app=seaweedfs-csi-driver-node --ignore-not-found --wait=false
                  kubectl -n kube-system delete pod -l app=seaweedfs-csi-driver-controller --ignore-not-found --wait=false
                fi
                last_rv="$rv"
                sleep 30
              done
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: seaweedfs-csi-openbao
