k8sServiceHost: k8s.service.jort.haus
k8sServicePort: 6443

autoDirectNodeRoutes: true

bgpControlPlane:
  enabled: false

devices: bond+

bpf:
  masquerade: true

cni:
  exclusive: false

gatewayAPI:
  enabled: true

ipam:
  mode: kubernetes

ipv4NativeRoutingCIDR: 10.42.0.0/16

kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256

nodePort:
  directRoutingDevice: bond+

l2announcements:
  enabled: false

loadBalancer:
  algorithm: maglev
  mode: snat

operator:
  replicas: 3

routingMode: native
