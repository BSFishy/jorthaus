apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oneuptime-backend-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 144h
  secretStoreRef:
    name: oneuptime-postgres
    kind: SecretStore
  target:
    name: oneuptime-backend-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: oneuptime
      data:
        database-username: '{{ "{{" }} index . "database-username" {{ "}}" }}'
        database-password: '{{ "{{" }} index . "database-password" {{ "}}" }}'
        valkey-username: '{{ "{{" }} index . "valkey-username" {{ "}}" }}'
        valkey-password: '{{ "{{" }} index . "valkey-password" {{ "}}" }}'
  dataFrom:
    - extract:
        key: static-creds/oneuptime-static
        decodingStrategy: None
      sourceRef:
        storeRef:
          name: oneuptime-postgres
          kind: SecretStore
      rewrite:
        - regexp:
            source: '^(username|password)$'
            target: 'database-$1'
    - extract:
        key: static-creds/oneuptime-static
        decodingStrategy: None
      sourceRef:
        storeRef:
          name: oneuptime-valkey
          kind: SecretStore
      rewrite:
        - regexp:
            source: '^(username|password)$'
            target: 'valkey-$1'
