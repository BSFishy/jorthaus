apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oneuptime-credential-sync
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["oneuptime-backend-credentials"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oneuptime-credential-sync
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: oneuptime-credential-sync
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oneuptime-credential-sync
