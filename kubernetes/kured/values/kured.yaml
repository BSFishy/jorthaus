configuration:
  rebootSentinel: /var/run/reboot-required
  rebootCommand: /usr/bin/nsenter --mount=/proc/1/ns/mnt -- /run/current-system/sw/bin/systemctl reboot
  startTime: "01:00"
  endTime: "05:00"
  timeZone: America/Chicago
  period: 1h
  lockReleaseDelay: 24h
  concurrency: 1
  annotateNodes: true
