apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: media-apps
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.jort.haus`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 20
      services:
        - name: authentik-server
          port: 80
    - match: Host(`sonarr.jort.haus`)
      kind: Rule
      priority: 10
      middlewares:
        - name: media-authentik
      services:
        - name: sonarr
          port: 8989
    - match: Host(`radarr.jort.haus`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 20
      services:
        - name: authentik-server
          port: 80
    - match: Host(`radarr.jort.haus`)
      kind: Rule
      priority: 10
      middlewares:
        - name: media-authentik
      services:
        - name: radarr
          port: 7878
    - match: Host(`prowlarr.jort.haus`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 20
      services:
        - name: authentik-server
          port: 80
    - match: Host(`prowlarr.jort.haus`)
      kind: Rule
      priority: 10
      middlewares:
        - name: media-authentik
      services:
        - name: prowlarr
          port: 9696
  tls: {}
