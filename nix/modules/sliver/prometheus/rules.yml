groups:
  - name: node-health
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node exporter on {{ $labels.host }} is unreachable"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than 10 minutes."
      - alert: NodeFilesystemSpaceLow
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem space is low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 10% available space."
      - alert: NodeMemoryAvailableLow
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Available memory is low on {{ $labels.host }}"
          description: "Less than 10% of memory is available on {{ $labels.instance }}."
  - name: monitoring-health
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager|victorialogs|thanos-sidecar|thanos-query|thanos-storegateway|thanos-compactor|kube-state-metrics|kubelet|kubelet-cadvisor|kubernetes-control-plane|coredns|kured|secrets-store-csi|traefik|cert-manager|authentik-server|authentik-worker|seaweedfs-csi|cilium-agent|cilium-operator|cilium-envoy"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is unreachable"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than 10 minutes."
  - name: kubernetes-object-health
    rules:
      - alert: KubernetesDeploymentReplicasUnavailable
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
          description: "The deployment has had unavailable replicas for more than 10 minutes."
      - alert: KubernetesPersistentVolumeClaimPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending"
          description: "The claim has remained pending for more than 10 minutes."
