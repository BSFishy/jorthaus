valkey:
  enabled: false

externalValkey:
  host: valkey.service.jort.haus
  port: 6379
  username: default
  existingSecret:
    name: oneuptime-backend-credentials
    passwordKey: valkey-password
  database: 1
  tls:
    enabled: true
    ca: *acme-root-ca

# Keep the rotating database role names in step with the rotating passwords.
# The chart's scalar username fields cannot read Secret keys, so override them
# with the global extraEnv list for every OneUptime component.
extraEnv:
  - name: DATABASE_USERNAME
    valueFrom:
      secretKeyRef:
        name: oneuptime-backend-credentials
        key: database-username
  - name: DATABASE_SSL_REJECT_UNAUTHORIZED
    value: "true"
  - name: VALKEY_USERNAME
    valueFrom:
      secretKeyRef:
        name: oneuptime-backend-credentials
        key: valkey-username

clickhouse:
  enabled: true # TODO: design and validate ClickHouse backup/restore before relying on production telemetry.
  persistence:
    enabled: true
    storageClass: seaweedfs-storage

nginx:
  service:
    type: ClusterIP
