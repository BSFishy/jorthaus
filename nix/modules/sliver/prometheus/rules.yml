groups:
  - name: node-health
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node exporter on {{ $labels.host }} is unreachable"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than 10 minutes."
      - record: node_cpu_utilization:ratio
        expr: |
          1 - avg by (host, instance) (
            rate(node_cpu_seconds_total{job="node", mode="idle"}[5m])
          )
      - alert: NodeCpuUsageWarning
        expr: node_cpu_utilization:ratio > 0.8 and node_cpu_utilization:ratio <= 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is high on {{ $labels.host }}"
          description: "Host CPU usage has remained above 80% for 15 minutes ({{ $value | humanizePercentage }})."
      - alert: NodeCpuUsageCritical
        expr: node_cpu_utilization:ratio > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CPU usage is critically high on {{ $labels.host }}"
          description: "Host CPU usage has remained above 95% for 5 minutes ({{ $value | humanizePercentage }})."
      - alert: NodeFilesystemSpaceLow
        expr: |
          100 * node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"}
          / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 10
          and
          100 * node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"}
          / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem space is low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 10% available space."
      - alert: NodeFilesystemSpaceCritical
        expr: 100 * node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem space is critically low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 5% available space."
      - alert: NodeFilesystemInodesLow
        expr: |
          100 * node_filesystem_files_free{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"}
          / node_filesystem_files{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 20
          and
          100 * node_filesystem_files_free{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"}
          / node_filesystem_files{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem inodes are low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 20% of inodes available."
      - alert: NodeFilesystemInodesCritical
        expr: 100 * node_filesystem_files_free{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} / node_filesystem_files{job="node", fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2|tracefs|debugfs|configfs|fuse.*"} < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem inodes are critically low on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} has less than 10% of inodes available."
      - alert: NodeMemoryAvailableLow
        expr: |
          100 * node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 10
          and
          100 * node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Available memory is low on {{ $labels.host }}"
          description: "Less than 10% of memory is available on {{ $labels.instance }}."
      - alert: NodeMemoryAvailableCritical
        expr: 100 * node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Available memory is critically low on {{ $labels.host }}"
          description: "Less than 5% of memory is available on {{ $labels.instance }}."
  - name: monitoring-health
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager|victorialogs|thanos-sidecar|thanos-query|thanos-storegateway|thanos-compactor|kube-state-metrics|kubelet|kubelet-cadvisor|kubernetes-control-plane|coredns|kured|secrets-store-csi|traefik|cert-manager|authentik-server|authentik-worker|seaweedfs-csi|cilium-agent|cilium-operator|cilium-envoy|postgres"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is unreachable"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than 10 minutes."
  - name: postgres-capacity
    rules:
      - alert: PostgresExporterDatabaseDown
        expr: pg_up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable from the exporter on {{ $labels.host }}"
          description: "The PostgreSQL exporter cannot connect to {{ $labels.instance }}."
      - alert: PostgresExporterScrapeErrors
        expr: pg_exporter_last_scrape_error{job="postgres"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter cannot collect all metrics from {{ $labels.host }}"
          description: "At least one PostgreSQL exporter collector is failing on {{ $labels.instance }}."
      - record: postgres_connection_slot_utilization:ratio
        expr: |
          (
            # The exporter excludes its single pooled backend from this metric.
            sum by (host, instance) (
              pg_stat_activity_count{job="postgres", backend_type="client backend"}
            )
            + 1
          )
          /
          (
            max by (host, instance) (pg_settings_max_connections{job="postgres"})
            - max by (host, instance) (pg_settings_superuser_reserved_connections{job="postgres"})
            - max by (host, instance) (pg_settings_reserved_connections{job="postgres"})
          )
      - alert: PostgresConnectionSlotsWarning
        expr: postgres_connection_slot_utilization:ratio >= 0.7 and postgres_connection_slot_utilization:ratio < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL client slots are above 70% on {{ $labels.host }}"
          description: "Client backends are using {{ $value | humanizePercentage }} of slots available to non-reserved roles."
      - alert: PostgresConnectionSlotsCritical
        expr: postgres_connection_slot_utilization:ratio >= 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL client slots are above 90% on {{ $labels.host }}"
          description: "Client backends are using {{ $value | humanizePercentage }} of slots available to non-reserved roles."
  - name: kubernetes-object-health
    rules:
      - alert: KubernetesDeploymentReplicasUnavailable
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
          description: "The deployment has had unavailable replicas for more than 10 minutes."
      - alert: KubernetesPersistentVolumeClaimPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending"
          description: "The claim has remained pending for more than 10 minutes."
