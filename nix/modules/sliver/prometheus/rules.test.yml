rule_files:
  - rules.yml
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'node_cpu_seconds_total{job="node",host="gaia-01",instance="10.1.10.1:9100",cpu="0",mode="idle"}'
        values: '0+3x50'
      - series: 'node_cpu_seconds_total{job="node",host="gaia-02",instance="10.1.10.2:9100",cpu="0",mode="idle"}'
        values: '0+0.9x50'
      - series: 'node_cpu_seconds_total{job="node",host="gaia-03",instance="10.1.10.3:9100",cpu="0",mode="idle"}'
        values: '0+27x50'
      - series: 'node_memory_MemAvailable_bytes{job="node",host="gaia-01",instance="10.1.10.1:9100"}'
        values: '8+0x50'
      - series: 'node_memory_MemTotal_bytes{job="node",host="gaia-01",instance="10.1.10.1:9100"}'
        values: '100+0x50'
      - series: 'node_memory_MemAvailable_bytes{job="node",host="gaia-02",instance="10.1.10.2:9100"}'
        values: '4+0x50'
      - series: 'node_memory_MemTotal_bytes{job="node",host="gaia-02",instance="10.1.10.2:9100"}'
        values: '100+0x50'
      - series: 'node_memory_MemAvailable_bytes{job="node",host="gaia-03",instance="10.1.10.3:9100"}'
        values: '50+0x50'
      - series: 'node_memory_MemTotal_bytes{job="node",host="gaia-03",instance="10.1.10.3:9100"}'
        values: '100+0x50'
      - series: 'node_filesystem_avail_bytes{job="node",host="gaia-01",instance="10.1.10.1:9100",device="/dev/test",fstype="xfs",mountpoint="/warning"}'
        values: '8+0x50'
      - series: 'node_filesystem_size_bytes{job="node",host="gaia-01",instance="10.1.10.1:9100",device="/dev/test",fstype="xfs",mountpoint="/warning"}'
        values: '100+0x50'
      - series: 'node_filesystem_avail_bytes{job="node",host="gaia-02",instance="10.1.10.2:9100",device="/dev/test",fstype="xfs",mountpoint="/critical"}'
        values: '4+0x50'
      - series: 'node_filesystem_size_bytes{job="node",host="gaia-02",instance="10.1.10.2:9100",device="/dev/test",fstype="xfs",mountpoint="/critical"}'
        values: '100+0x50'
      - series: 'node_filesystem_avail_bytes{job="node",host="gaia-03",instance="10.1.10.3:9100",device="/dev/test",fstype="xfs",mountpoint="/healthy"}'
        values: '50+0x50'
      - series: 'node_filesystem_size_bytes{job="node",host="gaia-03",instance="10.1.10.3:9100",device="/dev/test",fstype="xfs",mountpoint="/healthy"}'
        values: '100+0x50'
      - series: 'node_filesystem_files_free{job="node",host="gaia-01",instance="10.1.10.1:9100",device="/dev/test",fstype="xfs",mountpoint="/warning"}'
        values: '15+0x50'
      - series: 'node_filesystem_files{job="node",host="gaia-01",instance="10.1.10.1:9100",device="/dev/test",fstype="xfs",mountpoint="/warning"}'
        values: '100+0x50'
      - series: 'node_filesystem_files_free{job="node",host="gaia-02",instance="10.1.10.2:9100",device="/dev/test",fstype="xfs",mountpoint="/critical"}'
        values: '8+0x50'
      - series: 'node_filesystem_files{job="node",host="gaia-02",instance="10.1.10.2:9100",device="/dev/test",fstype="xfs",mountpoint="/critical"}'
        values: '100+0x50'
      - series: 'node_filesystem_files_free{job="node",host="gaia-03",instance="10.1.10.3:9100",device="/dev/test",fstype="xfs",mountpoint="/healthy"}'
        values: '50+0x50'
      - series: 'node_filesystem_files{job="node",host="gaia-03",instance="10.1.10.3:9100",device="/dev/test",fstype="xfs",mountpoint="/healthy"}'
        values: '100+0x50'
    alert_rule_test:
      - eval_time: 21m
        alertname: NodeCpuUsageWarning
        exp_alerts:
          - exp_labels:
              host: gaia-01
              instance: 10.1.10.1:9100
              severity: warning
            exp_annotations:
              summary: "CPU usage is high on gaia-01"
              description: "Host CPU usage has remained above 80% for 15 minutes (90%)."
      - eval_time: 21m
        alertname: NodeCpuUsageCritical
        exp_alerts:
          - exp_labels:
              host: gaia-02
              instance: 10.1.10.2:9100
              severity: critical
            exp_annotations:
              summary: "CPU usage is critically high on gaia-02"
              description: "Host CPU usage has remained above 95% for 5 minutes (97%)."
      - eval_time: 21m
        alertname: NodeMemoryAvailableLow
        exp_alerts:
          - exp_labels:
              job: node
              host: gaia-01
              instance: 10.1.10.1:9100
              severity: warning
            exp_annotations:
              summary: "Available memory is low on gaia-01"
              description: "Less than 10% of memory is available on 10.1.10.1:9100."
      - eval_time: 21m
        alertname: NodeMemoryAvailableCritical
        exp_alerts:
          - exp_labels:
              job: node
              host: gaia-02
              instance: 10.1.10.2:9100
              severity: critical
            exp_annotations:
              summary: "Available memory is critically low on gaia-02"
              description: "Less than 5% of memory is available on 10.1.10.2:9100."
      - eval_time: 21m
        alertname: NodeFilesystemSpaceLow
        exp_alerts:
          - exp_labels:
              job: node
              host: gaia-01
              instance: 10.1.10.1:9100
              device: /dev/test
              fstype: xfs
              mountpoint: /warning
              severity: warning
            exp_annotations:
              summary: "Filesystem space is low on gaia-01"
              description: "/warning has less than 10% available space."
      - eval_time: 21m
        alertname: NodeFilesystemSpaceCritical
        exp_alerts:
          - exp_labels:
              job: node
              host: gaia-02
              instance: 10.1.10.2:9100
              device: /dev/test
              fstype: xfs
              mountpoint: /critical
              severity: critical
            exp_annotations:
              summary: "Filesystem space is critically low on gaia-02"
              description: "/critical has less than 5% available space."
      - eval_time: 21m
        alertname: NodeFilesystemInodesLow
        exp_alerts:
          - exp_labels:
              job: node
              host: gaia-01
              instance: 10.1.10.1:9100
              device: /dev/test
              fstype: xfs
              mountpoint: /warning
              severity: warning
            exp_annotations:
              summary: "Filesystem inodes are low on gaia-01"
              description: "/warning has less than 20% of inodes available."
      - eval_time: 21m
        alertname: NodeFilesystemInodesCritical
        exp_alerts:
          - exp_labels:
              job: node
              host: gaia-02
              instance: 10.1.10.2:9100
              device: /dev/test
              fstype: xfs
              mountpoint: /critical
              severity: critical
            exp_annotations:
              summary: "Filesystem inodes are critically low on gaia-02"
              description: "/critical has less than 10% of inodes available."
  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node",host="gaia-01",instance="10.1.10.1:9100"}'
        values: '8+0x20 50+0x20'
      - series: 'node_memory_MemTotal_bytes{job="node",host="gaia-01",instance="10.1.10.1:9100"}'
        values: '100+0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: NodeMemoryAvailableLow
        exp_alerts:
          - exp_labels:
              job: node
              host: gaia-01
              instance: 10.1.10.1:9100
              severity: warning
            exp_annotations:
              summary: "Available memory is low on gaia-01"
              description: "Less than 10% of memory is available on 10.1.10.1:9100."
      - eval_time: 12m
        alertname: NodeMemoryAvailableLow
        exp_alerts: []
  - interval: 30s
    input_series:
      - series: 'kine_insert_errors_total{job="kubernetes-control-plane",host="gaia-01",instance="gaia-01.node.jort.haus:6443",retriable="false"}'
        values: '0+0x3 1+1x20'
      - series: 'up{job="victorialogs",host="gaia-02",instance="10.1.10.2:9428"}'
        values: '0+0x20'
      - series: 'up{job="fluent-bit",host="gaia-04",instance="10.1.10.4:2020"}'
        values: '0+0x20'
      - series: 'fluentbit_output_retries_total{job="fluent-bit",host="gaia-03",instance="10.1.10.3:2020",name="victorialogs-gaia-01"}'
        values: '0+0x3 1+1x20'
      - series: 'fluentbit_output_retries_failed_total{job="fluent-bit",host="gaia-03",instance="10.1.10.3:2020",name="victorialogs-gaia-01"}'
        values: '0+0x3 1+1x20'
      - series: 'fluentbit_input_storage_overlimit{job="fluent-bit",host="gaia-03",instance="10.1.10.3:2020",name="systemd.0"}'
        values: '0+0x3 1+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: K3sDatastoreWriteErrors
        exp_alerts:
          - exp_labels:
              job: kubernetes-control-plane
              host: gaia-01
              instance: gaia-01.node.jort.haus:6443
              retriable: "false"
              severity: critical
            exp_annotations:
              summary: "K3s datastore writes are failing on gaia-01"
              description: "Kine recorded failed PostgreSQL-backed datastore writes during the last 5 minutes."
      - eval_time: 4m
        alertname: VictoriaLogsReplicaUnavailable
        exp_alerts:
          - exp_labels:
              job: victorialogs
              host: gaia-02
              instance: 10.1.10.2:9428
              severity: critical
            exp_annotations:
              summary: "VictoriaLogs replica on gaia-02 is unavailable"
              description: "Prometheus cannot scrape the VictoriaLogs replica at 10.1.10.2:9428."
      - eval_time: 4m
        alertname: FluentBitMetricsTargetDown
        exp_alerts:
          - exp_labels:
              job: fluent-bit
              host: gaia-04
              instance: 10.1.10.4:2020
              severity: critical
            exp_annotations:
              summary: "Fluent Bit metrics target on gaia-04 is unavailable"
              description: "Prometheus cannot scrape Fluent Bit at 10.1.10.4:2020; log collection and output delivery may be impaired."
      - eval_time: 6m
        alertname: FluentBitOutputRetries
        exp_alerts:
          - exp_labels:
              job: fluent-bit
              host: gaia-03
              instance: 10.1.10.3:2020
              name: victorialogs-gaia-01
              severity: warning
            exp_annotations:
              summary: "Fluent Bit is retrying log delivery on gaia-03"
              description: "One or more Fluent Bit outputs retried batches during the last 5 minutes; inspect the output label victorialogs-gaia-01."
      - eval_time: 6m
        alertname: FluentBitOutputBatchesDropped
        exp_alerts:
          - exp_labels:
              job: fluent-bit
              host: gaia-03
              instance: 10.1.10.3:2020
              name: victorialogs-gaia-01
              severity: critical
            exp_annotations:
              summary: "Fluent Bit dropped log data on gaia-03"
              description: "An output abandoned a batch or dropped records during the last 5 minutes; inspect output victorialogs-gaia-01."
      - eval_time: 4m
        alertname: FluentBitInputStorageOverlimit
        exp_alerts:
          - exp_labels:
              job: fluent-bit
              host: gaia-03
              instance: 10.1.10.3:2020
              name: systemd.0
              severity: warning
            exp_annotations:
              summary: "Fluent Bit input storage is over limit on gaia-03"
              description: "An input has reached its configured storage limit, risking paused log collection."
  - interval: 30s
    input_series:
      - series: 'patroni_primary{job="patroni",host="gaia-01",instance="gaia-01.node.jort.haus:8008",scope="jorthaus-postgres",name="gaia-01"}'
        values: '1+0x20'
      - series: 'patroni_primary{job="patroni",host="gaia-02",instance="gaia-02.node.jort.haus:8008",scope="jorthaus-postgres",name="gaia-02"}'
        values: '0+0x20'
      - series: 'patroni_primary{job="patroni",host="gaia-03",instance="gaia-03.node.jort.haus:8008",scope="jorthaus-postgres",name="gaia-03"}'
        values: '0+0x3 1+0x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: PatroniLeaderCount
        exp_alerts: []
      - eval_time: 4m
        alertname: PatroniLeaderCount
        exp_alerts:
          - exp_labels:
              scope: jorthaus-postgres
              severity: critical
            exp_annotations:
              summary: "Patroni cluster jorthaus-postgres does not have exactly one leader"
              description: "Prometheus sees 2 Patroni leaders; investigate cluster state before rebooting a PostgreSQL node."
      - eval_time: 4m
        alertname: PatroniLeaderChanged
        exp_alerts:
          - exp_labels:
              job: patroni
              host: gaia-03
              instance: gaia-03.node.jort.haus:8008
              scope: jorthaus-postgres
              name: gaia-03
              severity: warning
            exp_annotations:
              summary: "Patroni role changed on gaia-03"
              description: "The Patroni leader/replica role changed within the last 10 minutes; correlate with planned maintenance and cluster health."
