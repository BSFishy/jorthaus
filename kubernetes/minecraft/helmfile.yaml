repositories:
  - name: itzg
    url: https://itzg.github.io/minecraft-server-charts

# TODO: Add a Kubernetes-native backup path for the Paper data volume so the
# world can be snapshotted on a schedule without relying on node-local jobs.
releases:
  - name: minecraft-server
    namespace: minecraft
    createNamespace: true
    chart: itzg/minecraft
    values:
      - values/server.yaml

  - name: minecraft-proxy
    namespace: minecraft
    createNamespace: true
    chart: itzg/minecraft-proxy
    values:
      - values/proxy.yaml
