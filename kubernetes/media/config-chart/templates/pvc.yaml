{{- range list "sonarr" "radarr" "prowlarr" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ . }}-config
  namespace: {{ $.Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: 2Gi
{{- end }}
