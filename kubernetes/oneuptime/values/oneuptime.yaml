host: oneuptime.jort.haus
httpProtocol: https
global:
  storageClass: seaweedfs-storage
ssl:
  provision: false

image:
  tag: 14.0.56
  pullPolicy: IfNotPresent

deployment:
  includeTimestampLabel: false

# The application is routed through Traefik and the existing Cloudflare proxy.
trustedProxyHops: 3

externalSecrets:
  oneuptimeSecret:
    existingSecret:
      name: oneuptime-openbao-secrets
      passwordKey: oneuptime-secret
  encryptionSecret:
    existingSecret:
      name: oneuptime-openbao-secrets
      passwordKey: encryption-secret
  registerProbeKey:
    existingSecret:
      name: oneuptime-openbao-secrets
      passwordKey: register-probe-key

probes:
  one:
    existingSecret:
      name: oneuptime-openbao-secrets
      passwordKey: probe-one-key

