apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-block-backup
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: thanos-block-backup-openbao
  namespace: {{ .Release.Namespace }}
spec:
  provider: vault
  secretObjects:
    - secretName: thanos-block-backup-credentials
      type: Opaque
      data:
        - objectName: source_access_key_id
          key: source_access_key_id
        - objectName: source_secret_access_key
          key: source_secret_access_key
        - objectName: b2_access_key_id
          key: b2_access_key_id
        - objectName: b2_secret_access_key
          key: b2_secret_access_key
        - objectName: b2_bucket_name
          key: b2_bucket_name
        - objectName: b2_endpoint
          key: b2_endpoint
        - objectName: b2_region
          key: b2_region
  parameters:
    roleName: thanos-block-backup
    vaultAuthMountPath: kubernetes
    audience: vault
    vaultAddress: https://openbao.service.jort.haus:8200
    objects: |
      - objectName: "source_access_key_id"
        secretPath: "seaweedfs/data/s3/bindings/thanos-backup-source"
        secretKey: "access_key_id"
      - objectName: "source_secret_access_key"
        secretPath: "seaweedfs/data/s3/bindings/thanos-backup-source"
        secretKey: "secret_access_key"
      - objectName: "b2_access_key_id"
        secretPath: "backup/data/thanos-block-replication"
        secretKey: "access_key_id"
      - objectName: "b2_secret_access_key"
        secretPath: "backup/data/thanos-block-replication"
        secretKey: "secret_access_key"
      - objectName: "b2_bucket_name"
        secretPath: "backup/data/thanos-block-replication"
        secretKey: "bucket_name"
      - objectName: "b2_endpoint"
        secretPath: "backup/data/thanos-block-replication"
        secretKey: "endpoint"
      - objectName: "b2_region"
        secretPath: "backup/data/thanos-block-replication"
        secretKey: "region"
---
