apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-csi-config-sync
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-csi-config-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-csi-config-sync
    spec:
      serviceAccountName: seaweedfs-csi-config-sync
      containers:
        - name: sync
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              while true; do
                ls -l /mnt/secrets-store
                sleep 3600
              done
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: seaweedfs-csi-openbao
