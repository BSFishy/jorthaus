apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-backup-secret-sync
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft-backup-secret-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft-backup-secret-sync
    spec:
      serviceAccountName: minecraft-backup-secret-sync
      containers:
        - name: sync
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              while true; do
                for path in /mnt/secrets-store/*; do
                  test -f "$path" || continue
                  test -s "$path"
                done
                sleep 3600
              done
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: minecraft-backup-openbao
