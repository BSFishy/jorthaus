apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oneuptime-external-secrets-token
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["oneuptime-credential-sync"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oneuptime-external-secrets-token
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oneuptime-external-secrets-token
