fullnameOverride: minecraft-server

initContainers:
  - name: render-paper-config
    image: busybox:1.36
    command:
      - sh
      - -ec
      - |
        mkdir -p /data/config
        cat > /data/config/paper-global.yml <<'EOF'
        proxies:
          velocity:
            enabled: true
            online-mode: true
            secret: "jorthaus-velocity-forwarding-secret"
        EOF
    volumeMounts:
      - name: datadir
        mountPath: /data

minecraftServer:
  eula: "TRUE"
  type: PAPER
  version: LATEST
  onlineMode: false
  motd: "jort.haus vanilla"
  memory: 2G
  extraEnv:
    ALLOW_FLIGHT: "TRUE"
  spawnProtection: 0
  serviceType: ClusterIP
  rcon:
    enabled: true
    existingSecret: minecraft-server-rcon
    secretKey: rcon-password
    serviceType: ClusterIP

mcbackup:
  enabled: true
  backupMethod: restic
  backupInterval: 24h
  backupName: vanilla
  resticHostname: vanilla
  pauseIfNoPlayers: "false"
  excludes: "*.jar,cache,logs"
  pruneResticRetention: "--keep-daily 14 --keep-weekly 8 --keep-monthly 12"
  resticEnvs:
    RESTIC_REPOSITORY:
      valueFrom:
        secretKeyRef:
          name: minecraft-backup-restic
          key: RESTIC_REPOSITORY
    RESTIC_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: minecraft-backup-restic
          key: RESTIC_PASSWORD
    AWS_ACCESS_KEY_ID:
      valueFrom:
        secretKeyRef:
          name: minecraft-backup-restic
          key: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      valueFrom:
        secretKeyRef:
          name: minecraft-backup-restic
          key: AWS_SECRET_ACCESS_KEY
    AWS_REGION:
      valueFrom:
        secretKeyRef:
          name: minecraft-backup-restic
          key: AWS_REGION
    AWS_DEFAULT_REGION:
      valueFrom:
        secretKeyRef:
          name: minecraft-backup-restic
          key: AWS_DEFAULT_REGION

persistence:
  storageClass: seaweedfs-storage
  dataDir:
    enabled: true
    Size: 20Gi
