apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oneuptime-openbao
  namespace: {{ .Release.Namespace }}
spec:
  provider: vault
  secretObjects:
    - secretName: oneuptime-openbao-secrets
      type: Opaque
      data:
        - objectName: oneuptime_secret
          key: oneuptime-secret
        - objectName: encryption_secret
          key: encryption-secret
        - objectName: register_probe_key
          key: register-probe-key
        - objectName: probe_one_key
          key: probe-one-key
  parameters:
    roleName: oneuptime-csi
    vaultAuthMountPath: kubernetes
    audience: vault
    vaultAddress: https://openbao.service.jort.haus:8200
    objects: |
      - objectName: "oneuptime_secret"
        secretPath: "oneuptime/data/config"
        secretKey: "oneuptime_secret"
      - objectName: "encryption_secret"
        secretPath: "oneuptime/data/config"
        secretKey: "encryption_secret"
      - objectName: "register_probe_key"
        secretPath: "oneuptime/data/config"
        secretKey: "register_probe_key"
      - objectName: "probe_one_key"
        secretPath: "oneuptime/data/config"
        secretKey: "probe_one_key"
